; Interactive UI host: runs the real display driver and input layer natively,
; renders each frame through the virtual panel. Driven over stdin by
; scripts/ui-serve.py. No hardware.
[env:native17]
build_src_filter = +<main.cpp>
platform = native
build_unflags = -std=gnu++11
build_flags =
	-std=c++17
	-g3
	-Wall
	-Wextra
	-Wno-unused-parameter
	-DNATIVE
lib_deps =
	SharpLcd=symlink://../../lib/SharpLcd
	Keypad=symlink://../../lib/Keypad
lib_compat_mode = off

[env:proposals]
platform = native
build_unflags = -std=gnu++11
build_src_filter = +<proposals.cpp>
build_flags = -std=c++17 -g3 -Wall -Wextra -Wno-unused-parameter -DNATIVE
lib_deps =
	SharpLcd=symlink://../../lib/SharpLcd
lib_compat_mode = off

[env:sheet]
platform = native
build_unflags = -std=gnu++11
build_src_filter = +<sheet.cpp>
build_flags = -std=c++17 -Wall -Wextra -DNATIVE
lib_deps =
	SharpLcd=symlink://../../lib/SharpLcd
lib_compat_mode = off
