; Thicket interop scenario 1: cold inbound.
;
; Native host build of a pure RNS receiver. Builds against the microReticulum
; SHA pinned in the top-level platformio.ini, materialised at
; test_interop/.deps/microReticulum by test_interop/scripts/fetch_deps.sh --
; so this suite tests the stack Thicket actually ships, not upstream HEAD.
;
;   bash ../scripts/fetch_deps.sh && pio run -e native17

[env]
build_type = debug
build_flags =
	-DRNS_USE_FS
	-DUSTORE_USE_UNIVERSALFS
	; Point-to-point loopback. macOS does not reliably loop limited-broadcast
	; traffic between two processes on one host, hence a fixed port pair.
	; This scenario owns 14262/14263; see test_interop/README.md for the map.
	-DDEFAULT_UDP_LOCAL_HOST=\"127.0.0.1\"
	-DDEFAULT_UDP_REMOTE_HOST=\"127.0.0.1\"
	-DDEFAULT_UDP_LOCAL_PORT=14263
	-DDEFAULT_UDP_REMOTE_PORT=14262
	; Transport.cpp references variables only declared under these.
	-DRNS_DEBUG_HEAP
	-DRNS_DEBUG_MEMORY
	-DRNS_DEBUG_METRICS
lib_deps =
	ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	https://github.com/attermann/Crypto.git#984dc891330986c302a86c4e312d4f5abcc28359
	https://github.com/attermann/microStore.git#0f28567fe00ab8ab14624a34c2e9e0a000a44c46
	microReticulum=symlink://../.deps/microReticulum
	udp_interface=symlink://../.deps/microReticulum/examples/common/udp_interface

[env:native17]
platform = native
build_unflags = -std=gnu++11
build_flags =
	${env.build_flags}
	-std=c++17
	-g3
	-Wall
	-Wextra
	-Wno-missing-field-initializers
	-Wno-format
	-Wno-unused-parameter
	-DNATIVE
lib_deps = ${env.lib_deps}
lib_compat_mode = off
