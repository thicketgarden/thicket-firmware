; Thicket interop scenario: identity sealed under a code.
;
; No network and no second process. This one decrypts a file upstream's device
; wrote, using our vendored copy of their encrypted store.
;
;   bash ../scripts/fetch_deps.sh && pio run -e native17

[env]
build_type = debug
build_flags =
	-DRNS_USE_FS
	-DUSTORE_USE_UNIVERSALFS
	-DRNS_DEBUG_HEAP
	-DRNS_DEBUG_MEMORY
	-DRNS_DEBUG_METRICS
lib_deps =
	ArduinoJson@^7.4.2
	https://github.com/hideakitai/MsgPack.git#1f552c31b940d6e9063ee17a4b3fa10c47b27169
	https://github.com/attermann/Crypto.git#984dc891330986c302a86c4e312d4f5abcc28359
	https://github.com/wet-bulb/microStore.git#c5697b85a156e1b18372d7a190136bfd2c379545
	microReticulum=symlink://../.deps/microReticulum
	Password=symlink://../../lib/Password

[env:native17]
platform = native
build_unflags = -std=gnu++11
build_flags =
	${env.build_flags}
	-std=c++17
	-g3
	-Wall
	-Wextra
	-Wno-missing-field-initializers
	-Wno-format
	-Wno-unused-parameter
	-DNATIVE
lib_deps = ${env.lib_deps}
lib_compat_mode = off
