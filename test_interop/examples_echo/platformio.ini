; Thicket interop scenario: the reference's own Examples/Echo.py.
;
; Talks to upstream's example script, unmodified, at the pinned RNS version.
;
;   bash ../scripts/fetch_deps.sh && pio run -e native17

[env]
build_type = debug
build_flags =
	-DRNS_USE_FS
	-DUSTORE_USE_UNIVERSALFS
	; This scenario owns 14280-14283 and needs TWO interfaces, one per
	; neighbour, so the ports are constructor arguments rather than these
	; macros -- see common/udp2/README.md. The defines are still required
	; because the vendored source references them for its fallback values.
	-DDEFAULT_UDP_LOCAL_HOST=\"127.0.0.1\"
	-DDEFAULT_UDP_REMOTE_HOST=\"127.0.0.1\"
	-DDEFAULT_UDP_LOCAL_PORT=14281
	-DDEFAULT_UDP_REMOTE_PORT=14280
	; Transport.cpp references variables only declared under these.
	-DRNS_DEBUG_HEAP
	-DRNS_DEBUG_MEMORY
	-DRNS_DEBUG_METRICS
lib_deps =
	ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	https://github.com/attermann/Crypto.git#984dc891330986c302a86c4e312d4f5abcc28359
	https://github.com/wet-bulb/microStore.git#c5697b85a156e1b18372d7a190136bfd2c379545
	microReticulum=symlink://../.deps/microReticulum
	udp2=symlink://../common/udp2

[env:native17]
platform = native
build_unflags = -std=gnu++11
build_flags =
	${env.build_flags}
	-std=c++17
	-g3
	-Wall
	-Wextra
	-Wno-missing-field-initializers
	-Wno-format
	-Wno-unused-parameter
	-DNATIVE
lib_deps = ${env.lib_deps}
lib_compat_mode = off
