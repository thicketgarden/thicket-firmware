; Thicket interop scenario 3: identity reference vectors.
;
; No network and no UDP interface -- this one compares microReticulum's
; Identity arithmetic against fixed outputs of the Python reference.
;
;   bash ../scripts/fetch_deps.sh && pio run -e native17

[env]
build_type = debug
build_flags =
	-DRNS_USE_FS
	-DUSTORE_USE_UNIVERSALFS
	-DRNS_DEBUG_HEAP
	-DRNS_DEBUG_MEMORY
	-DRNS_DEBUG_METRICS
lib_deps =
	ArduinoJson@^7.4.2
	https://github.com/hideakitai/MsgPack.git#1f552c31b940d6e9063ee17a4b3fa10c47b27169
	https://github.com/attermann/Crypto.git#984dc891330986c302a86c4e312d4f5abcc28359
	https://github.com/attermann/microStore.git#0f28567fe00ab8ab14624a34c2e9e0a000a44c46
	microReticulum=symlink://../.deps/microReticulum

[env:native17]
platform = native
build_unflags = -std=gnu++11
build_flags =
	${env.build_flags}
	-std=c++17
	-g3
	-Wall
	-Wextra
	-Wno-missing-field-initializers
	-Wno-format
	-Wno-unused-parameter
	-DNATIVE
lib_deps = ${env.lib_deps}
lib_compat_mode = off
