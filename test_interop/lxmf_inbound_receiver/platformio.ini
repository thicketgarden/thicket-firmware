; Thicket interop scenario 2: LXMF delivery inbound.
;
; Native host build of an LXMF receiver: microLXMF's LXMRouter on top of the
; microReticulum we pin, receiving a message originated by the Python LXMF
; reference and asserting the decoded fields.
;
; Why this exists when microLXMF already has a conformance bridge: that suite
; builds microLXMF against torlando-tech/microReticulum, a different fork from
; a different upstream base than the one Thicket ships. It tests the LXMF
; layer; it does not test the LXMF layer on OUR RNS layer.
;
; The microLXMF and MsgPack SHAs below MUST match the top-level platformio.ini;
; test_interop/scripts/fetch_deps.sh fails the run if they drift.
;
;   bash ../scripts/fetch_deps.sh && pio run -e native17

[env]
build_type = debug
build_flags =
	-DRNS_USE_FS
	-DUSTORE_USE_UNIVERSALFS
	-DDEFAULT_UDP_LOCAL_HOST=\"127.0.0.1\"
	-DDEFAULT_UDP_REMOTE_HOST=\"127.0.0.1\"
	-DDEFAULT_UDP_LOCAL_PORT=14273
	-DDEFAULT_UDP_REMOTE_PORT=14272
	-DRNS_DEBUG_HEAP
	-DRNS_DEBUG_MEMORY
	-DRNS_DEBUG_METRICS
	; Same MessageStore pool geometry the firmware ships. Testing microLXMF at
	; stock sizes would test a configuration we do not build.
	-DLXMF_MAX_CONVERSATIONS=8
	-DLXMF_MAX_MESSAGES_PER_CONVERSATION=32
	-DLXMF_HOT_MESSAGES_PER_CONVERSATION=16
lib_deps =
	ArduinoJson@^7.4.2
	https://github.com/hideakitai/MsgPack.git#1f552c31b940d6e9063ee17a4b3fa10c47b27169
	https://github.com/attermann/Crypto.git#984dc891330986c302a86c4e312d4f5abcc28359
	https://github.com/wet-bulb/microStore.git#c5697b85a156e1b18372d7a190136bfd2c379545
	https://github.com/wet-bulb/microLXMF.git#b3d7f6cdd1989d6ad0027afdb31b7d8d0d672b78
	microReticulum=symlink://../.deps/microReticulum
	udp_interface=symlink://../.deps/microReticulum/examples/common/udp_interface

[env:native17]
platform = native
build_unflags = -std=gnu++11
build_flags =
	${env.build_flags}
	-std=c++17
	-g3
	-Wall
	-Wextra
	-Wno-missing-field-initializers
	-Wno-format
	-Wno-unused-parameter
	-DNATIVE
	; microLXMF's headers include <Bytes.h> etc. flat; microReticulum exposes
	; only src/. Every consumer has to add this itself (same line as the
	; firmware's platformio.ini).
	-I../.deps/microReticulum/src/microReticulum
lib_deps = ${env.lib_deps}
lib_compat_mode = off
; Reuse the firmware's own dependency patches, unchanged, so this scenario
; compiles the same patched microLXMF/MsgPack the firmware does. If a pin moves
; and a patch stops anchoring, this build goes red for the same reason the
; firmware build does.
extra_scripts = pre:../../scripts/patch_deps.py
