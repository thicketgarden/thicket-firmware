;
; Desktop page browser, LIVE-FETCH build.
;
; The plain browser (see Makefile) is a bare-compiler SDL build for the fast
; local loop and links only the renderer. Fetching a page off the mesh needs
; the whole Reticulum stack, which is what this env links: browser.cpp and
; LiveFetch.cpp built headless (--script only) with THICKET_LIVE_FETCH, against
; the same microReticulum the firmware pins.
;
; microReticulum and the UDP interface come from the tree the interop suite
; materialises (test_interop/.deps/microReticulum), so this build cannot drift
; from the firmware pin. Fetch it once, then build:
;
;   bash ../test_interop/scripts/fetch_deps.sh
;   pio run -e desktop_live
;
; The UDP endpoint below points at a local rnsd (or the interop page-fetch
; server) on the loopback port pair the suite uses. A build that reaches a
; different bridge overrides DEFAULT_UDP_* the same way the scenarios do.

[platformio]
src_dir = .
default_envs = desktop_live

[env:desktop_live]
platform = native
build_type = debug
lib_extra_dirs = ../lib
lib_compat_mode = off
build_unflags = -std=gnu++11
build_flags =
	-std=c++17
	-g3
	-Wall
	-Wextra
	-Wno-missing-field-initializers
	-Wno-format
	-Wno-unused-parameter
	-DNATIVE
	-DRNS_USE_FS
	-DUSTORE_USE_UNIVERSALFS
	; On-device decompression cap, kept identical to the firmware so the browser
	; rejects the same over-cap pages the handheld would.
	-DRNS_BUNZIP_CAP=12288
	; Headless: no SDL video, the fetched page is proven through --script.
	-DTHICKET_NO_SDL
	-DTHICKET_LIVE_FETCH
	; The rnsd bridge on the loopback. This owns local 14300 / remote 14301, the
	; pair the page-fetch interop server expects.
	-DDEFAULT_UDP_LOCAL_HOST=\"127.0.0.1\"
	-DDEFAULT_UDP_REMOTE_HOST=\"127.0.0.1\"
	-DDEFAULT_UDP_LOCAL_PORT=14300
	-DDEFAULT_UDP_REMOTE_PORT=14301
lib_deps =
	https://github.com/thicketgarden/micron-cpp.git#c8b1e05039288288b06ca775ee4b8eff3cf10ac0
	ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	https://github.com/attermann/Crypto.git#984dc891330986c302a86c4e312d4f5abcc28359
	https://github.com/wet-bulb/microStore.git#c5697b85a156e1b18372d7a190136bfd2c379545
	microReticulum=symlink://../test_interop/.deps/microReticulum
	udp_interface=symlink://../test_interop/.deps/microReticulum/examples/common/udp_interface
