name: interop

# Runs the four microReticulum interop scenarios (packet, link, request,
# resource) against a real Python RNS peer.
#
# WHY THIS EXISTS
#
# microReticulum declares no target RNS version anywhere — no constant, no
# README statement, no CHANGELOG entry. So our interoperation with current
# Reticulum is demonstrated BY TEST and never BY CONTRACT, which means it can
# regress with no signal at all: no compile error, no version warning. The
# device would announce, look healthy, and quietly stop being reachable.
#
# Two jobs, doing two different things:
#
#   interop-pinned  — every push, against a KNOWN RNS version. Deterministic.
#                     Must pass. Catches us breaking ourselves, and fires
#                     automatically whenever the microReticulum pin is bumped
#                     (because the pin is read out of platformio.ini below).
#
#   interop-latest  — weekly, against whatever RNS is CURRENT. Allowed to
#                     fail, and a failure is the entire point: it is the only
#                     early warning that the ecosystem moved out from under
#                     us. A red scheduled run emails the repo owner, which
#                     turns an unmonitorable risk into a Tuesday morning.
#
# The interop senders live in the microReticulum repo, not here, so this tests
# the stack we pin rather than our application code. That is deliberate: the
# thing that can silently regress is the dependency.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'platformio.ini'
      - '.github/workflows/interop.yml'
  schedule:
    # Mondays 07:00 UTC. Weekly is enough — RNS releases are not daily, and a
    # week of exposure is acceptable for something nothing currently watches.
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  interop-pinned:
    name: interop (RNS pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4

      - name: Resolve the pinned microReticulum revision
        id: pin
        # Read the pin out of platformio.ini so this test always exercises
        # exactly what the firmware ships. Bumping the pin re-runs this job
        # automatically, which is the standing regression check the register
        # requires rather than one that depends on someone remembering.
        run: |
          set -euo pipefail
          LINE="$(grep -oE 'https://github\.com/[A-Za-z0-9_.-]+/microReticulum\.git#[0-9a-f]+' platformio.ini | head -1)"
          if [ -z "$LINE" ]; then
            echo "::error::No pinned microReticulum git URL found in platformio.ini"
            exit 1
          fi
          REPO_URL="${LINE%%#*}"
          SHA="${LINE##*#}"
          # Validate before it reaches actions/checkout. A ref taken from a
          # file and passed unchecked into checkout is a ref-injection route,
          # even when the file is ours.
          if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Refusing to check out a revision that is not a 40-char hex SHA: $SHA"
            exit 1
          fi
          SLUG="$(printf '%s' "$REPO_URL" | sed -E 's#https://github\.com/([^/]+/[^/]+)\.git#\1#')"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"   >> "$GITHUB_OUTPUT"
          echo "Pinned: $SLUG @ $SHA"

      - name: Checkout pinned microReticulum
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.slug }}
          ref: ${{ steps.pin.outputs.sha }}
          path: microReticulum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and Python RNS
        env:
          # The version we have actually demonstrated interoperation against.
          # Change this deliberately, with a run to back it up — not to make
          # a red build go green.
          RNS_VERSION: '1.4.2'
        run: |
          set -euo pipefail
          pip install --upgrade platformio
          pip install "rns==${RNS_VERSION}"
          python -c "import RNS; print('RNS', RNS.__version__)"

      - name: Run all four interop scenarios
        working-directory: microReticulum
        run: bash test_interop/run_all.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p interop-logs
          cp -r /tmp/microreticulum_interop_* interop-logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interop-logs-pinned
          path: interop-logs
          if-no-files-found: ignore

  interop-latest:
    name: interop (RNS latest — early warning)
    # Scheduled and manual only. On every push it would be noise; weekly it is
    # a signal. A failure here does NOT mean we are broken today — it means
    # current RNS and our pinned stack have diverged and someone should look.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4

      - name: Resolve the pinned microReticulum revision
        id: pin
        run: |
          set -euo pipefail
          LINE="$(grep -oE 'https://github\.com/[A-Za-z0-9_.-]+/microReticulum\.git#[0-9a-f]+' platformio.ini | head -1)"
          [ -n "$LINE" ] || { echo "::error::No pinned microReticulum git URL in platformio.ini"; exit 1; }
          SHA="${LINE##*#}"
          printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$' || { echo "::error::Bad SHA: $SHA"; exit 1; }
          SLUG="$(printf '%s' "${LINE%%#*}" | sed -E 's#https://github\.com/([^/]+/[^/]+)\.git#\1#')"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"   >> "$GITHUB_OUTPUT"

      - name: Checkout pinned microReticulum
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.slug }}
          ref: ${{ steps.pin.outputs.sha }}
          path: microReticulum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and the CURRENT Python RNS
        run: |
          set -euo pipefail
          pip install --upgrade platformio
          pip install --upgrade rns
          python -c "import RNS; print('RNS', RNS.__version__)"

      - name: Record which RNS version this ran against
        # Whatever the outcome, the version has to be in the log. "It worked"
        # is worthless without knowing what it worked against.
        run: |
          echo "### Ran against RNS $(python -c 'import RNS; print(RNS.__version__)')" >> "$GITHUB_STEP_SUMMARY"

      - name: Run all four interop scenarios
        working-directory: microReticulum
        run: bash test_interop/run_all.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p interop-logs
          cp -r /tmp/microreticulum_interop_* interop-logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interop-logs-latest
          path: interop-logs
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Thicket's own suite, in test_interop/ in THIS repo. Distinct from the jobs
  # above, which run microReticulum's suite inside the microReticulum checkout.
  #
  # These are the Python-originated scenarios: the reference speaks first and we
  # have to receive, which is the case a handheld actually lives in. They build
  # against the microReticulum SHA in platformio.ini, so they cannot drift from
  # the firmware.
  # ---------------------------------------------------------------------------
  thicket-interop:
    name: thicket interop (Python originates)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and the pinned Python reference
        env:
          # Pinned for the same reason every dependency here is pinned: an
          # unpinned reference makes a green run mean nothing in a month, and
          # turns an upstream release into a mystery failure of ours.
          RNS_VERSION: '1.4.2'
          LXMF_VERSION: '1.1.1'
        run: |
          set -euo pipefail
          pip install --upgrade platformio
          pip install "rns==${RNS_VERSION}" "lxmf==${LXMF_VERSION}"
          python -c "import RNS, LXMF; print('RNS', RNS.__version__, '| LXMF', LXMF.__version__)"

      - name: Run the Thicket interop suite
        run: bash test_interop/run_all.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p thicket-interop-logs
          cp -r /tmp/thicket_interop_* thicket-interop-logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: thicket-interop-logs
          path: thicket-interop-logs
          if-no-files-found: ignore

  verify-upstream-bug:
    # Manual only. Runs UNPATCHED upstream attermann/microReticulum and expects
    # the interop scenarios to FAIL.
    #
    # This exists because our other interop jobs test our FORK, which carries
    # the transport_enabled store-init fix — so they can prove the fix works
    # and can never demonstrate the bug it fixes. Before telling a maintainer
    # that his own test suite fails, we should be able to show it failing.
    #
    # A green run here means "the bug reproduces, as reported".
    # A red run here means "upstream is fine and our issue is wrong" — which
    # is the outcome worth catching before it is sent, not after.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout UNPATCHED upstream at the SHA we forked from
        uses: actions/checkout@v4
        with:
          repository: attermann/microReticulum
          ref: 40fa628809d57140180c1c833559ab96fec992c1
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and Python RNS
        run: |
          set -euo pipefail
          pip install --upgrade platformio
          pip install "rns==1.4.2"
          python -c "import RNS; print('RNS', RNS.__version__)"

      - name: Confirm the gate is present in this checkout
        working-directory: upstream
        run: |
          set -euo pipefail
          echo "--- Transport.cpp around the store-init gate ---"
          sed -n '378,382p' src/microReticulum/Transport.cpp
          grep -q 'if (Reticulum::transport_enabled())' src/microReticulum/Transport.cpp \
            || { echo "::error::gate not found — upstream moved, re-anchor this job"; exit 1; }

      - name: Confirm the senders run with transport disabled
        working-directory: upstream
        run: grep -rn "transport_enabled(false)" test_interop/ || true

      - name: Run interop and EXPECT FAILURE
        working-directory: upstream
        run: |
          set +e
          bash test_interop/run_all.sh
          rc=$?
          set -e
          echo "run_all.sh exit code: $rc"
          if [ "$rc" -eq 0 ]; then
            echo "::error::Upstream interop PASSED. The bug does not reproduce as reported —"
            echo "::error::do NOT send the issue until this is understood."
            exit 1
          fi
          echo "Upstream interop failed as expected. The reported bug reproduces."

      - name: Collect logs
        if: always()
        run: |
          mkdir -p upstream-logs
          cp -r /tmp/microreticulum_interop_* upstream-logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-unpatched-logs
          path: upstream-logs
          if-no-files-found: ignore

