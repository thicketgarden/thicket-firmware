name: build

# Both envs must build on every push. The no-BLE env is not optional here:
# it exists as the flash/compliance fallback and a fallback that has rotted
# is not a fallback.
#
# This job also exists to catch scripts/patch_deps.py failing. Those patches
# are anchored to exact upstream text and sys.exit(1) when a pin moves —
# which is correct, but until now the only place that alarm could fire was
# someone's laptop, whenever they happened to build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Cheap and first. A pin that disagrees across build paths makes every job
  # below it test a stack nobody ships, and the symptom is a compile error deep
  # in a dependency rather than anything that names the cause. Seconds here
  # against ten minutes of misleading red.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Rule 3 checks the pins *inside* the pinned dependency, which is the one
      # that has actually bitten. It needs the dependency on disk to see them.
      - name: Fetch pinned dependencies
        run: pio pkg install -e wiscore_rak4631

      - name: Every build path resolves the same commit
        run: python3 scripts/check_pins.py

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [wiscore_rak4631, wiscore_rak4631-noble]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Report size
        # Informational. Flash and RAM numbers belong in the log so a jump is
        # visible in the diff of two runs rather than discovered at link time
        # on the day the image stops fitting.
        run: pio run -e ${{ matrix.env }} 2>&1 | grep -E "RAM:|Flash:" || true

  test:
    # Host-side unit tests. This is the first CI job that exercises OUR code
    # rather than a dependency — the interop workflow proves microReticulum
    # talks to Python RNS, and proved nothing about anything we wrote.
    name: unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native unit tests
        run: pio test -e native

