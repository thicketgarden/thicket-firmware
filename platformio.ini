; Thicket firmware — RAK4631 (nRF52840 + SX1262), 915 MHz US.
; Baseline env must always build: `pio run -e wiscore_rak4631`.
;
; Landmines (see CLAUDE.md and the comments below):
; - nRF52 internal filesystem is ~28 KB. All persistence (identity, keys,
;   message store) belongs on external SPI flash, never internal FS.
; - Adafruit nRF52 BSP: SoftDevice owns flash regions + IRQ priorities.
; - SX1262 bring-up: if TX misbehaves, suspect INTERFERENCE AVOIDANCE first
;   (-DDISABLE_IA), not the radio config. The `rak4631` branch is contested and
;   disowned upstream; PR #91 is the live path. See CLAUDE.md.

; Board def + variant mirrored from attermann/microReticulum_Firmware (GPL-3.0),
; boards/rak4630.json + variants/rak4630/ — no RAK4630/4631 board ships with
; the stock nordicnrf52 platform. Env name kept as wiscore_rak4631 to match
; upstream's build target.

; ---------------------------------------------------------------------------
; Pinned dependencies. Every one is an explicit commit — a moving tag or branch
; head makes the flash/RAM numbers in the commit log meaningless and re-exposes
; us to the upstream text the patch script anchors against.
;
;   attermann/microReticulum   40fa628809d57140180c1c833559ab96fec992c1  0.5.0   Apache-2.0
;   torlando-tech/microLXMF    d9bbc04cf69bfa9b555c3f293b89b440b4820518  (no tag) GPL-3.0
;   attermann/microStore       0f28567fe00ab8ab14624a34c2e9e0a000a44c46  0.1.7   Apache-2.0
;   attermann/Crypto           984dc891330986c302a86c4e312d4f5abcc28359  0.4.0   MIT
;   attermann/Adafruit_SPIFlash d73ef4a3938b906a0a312fae159ed0d93733a1d8 (littlefs branch) MIT
;   adafruit/SdFat             daa55e618c88a0e3c72ed3a5c97aecd9322a4fa7  2.3.54  MIT
;   adafruit/Adafruit_TinyUSB  08c7dabed48b5ab92839289f58191b3f04f48fb0  3.7.7   MIT
;   hideakitai/MsgPack         1f552c31b940d6e9063ee17a4b3fa10c47b27169  0.4.2   MIT
;   bblanchon/ArduinoJson      869d440274019939d8f03f5324108d1694e5118a  7.4.3   MIT
;   jgromes/RadioLib           2a2f6e0edf5a527cd83d2a04a7e2eb5d220329cd  7.3.0   MIT
;
; LoRaInterface is NOT a lib_dep: upstream ships it at
; examples/common/lora_interface/ inside the microReticulum repo, and
; PlatformIO cannot depend on a repo subdirectory. It is vendored at
; lib/LoRaInterface/ — see lib/LoRaInterface/README.md for origin SHA and the
; list of Thicket modifications.
; ---------------------------------------------------------------------------

[thicket]
; Shared across both envs so the no-BLE fallback cannot drift from the
; baseline in anything except the linker script and the BLE define.
lib_deps =
	; Our fork. Pinned to a SHA, not a branch, so the build stays reproducible.
	; Forked from attermann/microReticulum @ 40fa628809d5 (0.5.0-8) and carries
	; two changes:
	;   1. Transport::start() initialises the path/known/hashlist stores
	;      regardless of transport mode. Without it an instance running with
	;      enable_transport false cannot address a peer at all, which is the
	;      default configuration for a battery-powered handheld.
	;      Submittable as fix/transport-store-init.
	;   2. Transport::start() applies the record cap to the path store, as it
	;      already does for the known-destinations and hashlist stores. Without
	;      it RNS_PATH_TABLE_MAX never reaches microStore, whose policy_max_recs
	;      defaults to 0 = disabled, so the path store runs uncapped and the
	;      threshold compaction gated on the same value never fires.
	;      Defaults unchanged. Submittable as fix/apply-path-store-cap.
	; Branch thicket/integration carries both.
	; ⚠ Bumping this SHA requires re-running the interop suite against a
	; current Python RNS and recording the version it passed against.
	https://github.com/wet-bulb/microReticulum.git#2cba97640c35f0dc03623fa65b7351849bab0601
		; Our fork of microLXMF, pinned to a SHA.
	; ⚠ Upstream is torlando-tech/microLXMF, NOT attermann/microLXMF. We pinned
	; attermann's for months; it is a fork of torlando's and had not moved since
	; 2026-05-11, leaving us 17 commits behind the real project, missing
	; transactional message persistence, corrupt-store handling and a rollback
	; path. Corrected 2026-08-02.
	; Forked from torlando-tech/microLXMF main; carries two changes:
	;   1. MessageStore's pool limits settable at build time (see below),
	;      submittable as fix/configurable-store-limits — PR #8, open.
	;   2. an oversized persisted index is truncated rather than rejected,
	;      submittable as fix/index-downgrade-truncates — held until #8
	;      resolves so a config knob and a data-loss policy stay separate.
	; Branch thicket/integration carries both.
	https://github.com/wet-bulb/microLXMF.git#75df3417ff4f97d2cd823676394a2d59cdc390b8
	https://github.com/attermann/microStore.git#0f28567fe00ab8ab14624a34c2e9e0a000a44c46
	https://github.com/attermann/Crypto.git#984dc891330986c302a86c4e312d4f5abcc28359
	https://github.com/attermann/Adafruit_SPIFlash.git#d73ef4a3938b906a0a312fae159ed0d93733a1d8
	https://github.com/adafruit/SdFat.git#daa55e618c88a0e3c72ed3a5c97aecd9322a4fa7
	https://github.com/adafruit/Adafruit_TinyUSB_Arduino.git#08c7dabed48b5ab92839289f58191b3f04f48fb0
	https://github.com/hideakitai/MsgPack.git#1f552c31b940d6e9063ee17a4b3fa10c47b27169
	https://github.com/bblanchon/ArduinoJson.git#869d440274019939d8f03f5324108d1694e5118a
	https://github.com/jgromes/RadioLib.git#2a2f6e0edf5a527cd83d2a04a7e2eb5d220329cd

; The nordicnrf52 Arduino builder hard-codes these (adafruit.py:84,93-95,129-131).
; Every one of them has to come back off before the stack will build or fit.
build_unflags =
	-Ofast
	-std=gnu++11
	-fno-rtti
	-fno-exceptions
	--specs=nano.specs

build_flags =
; --- optimisation -----------------------------------------------------------
; The nordicnrf52 platform compiles Adafruit Arduino targets at -Ofast with
; --param max-inline-insns-single=500 (see adafruit.py:84,129). Measured on the
; RNS+LXMF stack that single default is 44.7% of the image — 98.96% of flash
; versus 33.76% at -Os. Override it explicitly and permanently.
; ⚠ Link-time measurement only; runtime behaviour needs bench validation.
	-Os
; --- C++ dialect and runtime ------------------------------------------------
; microReticulum + microLXMF are C++17 and throw: 95 throw sites and 145 catch
; clauses in microReticulum alone, 5/19 more in microLXMF. Building
; -fno-exceptions produces 210 errors across 29 of 40 translation units; that
; is a rewrite of upstream's error-handling contract, not a flag. Exceptions
; stay. RTTI is unused (zero dynamic_cast, zero typeid) but -fno-rtti saves
; 136 bytes and exceptions still need typeinfo, so it is not worth the
; divergence from upstream's own env.
	-std=gnu++17
	-fexceptions
	-frtti
; nano.specs is what upstream disables here. Restoring it measured -56,192 B
; but changes printf/malloc/reentrancy under us, and upstream's comment
; ("Required for exception handling on nordicnrf52") reads like a runtime
; failure nobody wrote down. Do not restore it without bench evidence.
	--specs=nosys.specs
; --- USB / serial -----------------------------------------------------------
; Adafruit nRF52 core: USB-CDC Serial lives in TinyUSB — without this flag
; the link fails with undefined Adafruit_USBD_CDC references.
	-DUSE_TINYUSB
; --- board identification ---------------------------------------------------
	-DMCU_NRF52
	-DBOARD_RAK4631
; --- microReticulum ---------------------------------------------------------
; RNS_USE_FS is what makes Identity::to_file/from_file compile to something
; other than `return false` — i.e. it is what makes persistent identity exist.
	-DRNS_USE_FS
; TLSF pool. Upstream's own wiscore_rak4631 env ships 204800 (200 KiB ≈ 78% of
; the 237,568 B SRAM region) — that is inside the documented silent-hard-fault
; zone and faults before USB enumerates, so the board looks dead. The pool is
; malloc'd at runtime (Utilities/Memory.cpp pool_init), so it never shows up in
; a static size report: `RAM: n%` below is short by exactly this number.
; 65536 is the bring-up value. TUNABLE — raise toward 98304 only with a board
; on the bench that still enumerates.
	-DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_POOL_ALLOCATOR
	-DRNS_CONTAINER_ALLOCATOR=RNS_HEAP_POOL_ALLOCATOR
	-DRNS_HEAP_POOL_BUFFER_SIZE=65536
; Interference avoidance, inherited from RNode_Firmware, "seems to completely
; hose nRF52 boards" per the maintainer. Off from day one; we never want to
; debug the radio with it on.
	-DDISABLE_IA
; --- microStore -------------------------------------------------------------
; FLASHFS only. NOT UniversalFS: on nRF52 microStore aliases UniversalFileSystem
; to InternalFSFileSystem, which is the ~28 KB internal filesystem — far too
; small for message storage. A separate interrupts-off erase claim exists upstream
; RadioLib's SPI transactions to the SX1262. External SPI flash or nothing.
	-DUSTORE_USE_FLASHFS
	-DLFS_NO_ASSERT
; --- msgpack ----------------------------------------------------------------
	-DMSGPACK_USE_BOOST=OFF
; --- microLXMF -------------------------------------------------------------
; MessageStore's pool is MAX_CONVERSATIONS * MAX_MESSAGES_PER_CONVERSATION *
; 32 bytes. Upstream's 32 x 256 is 262,144 B of message_hashes alone, which
; exceeds this part's entire SRAM, so the store cannot be instantiated at all.
; 8 x 32 is 8,192 B. Sizes are provisional until the RAM budget is settled.
	-DLXMF_MAX_CONVERSATIONS=8
	-DLXMF_MAX_MESSAGES_PER_CONVERSATION=32
; Must stay below the hard cap above. cull_conversation_to_hot returns
; early while message_count <= this, so a hot count at or above the cap
; means the cull never runs: the archive tier goes dead and eviction
; deletes the oldest message instead of moving it. Upstream's default is
; 50, which is ABOVE our cap of 32 — we were in exactly that state until
; the tiers test was run at our own pool size.
	-DLXMF_HOT_MESSAGES_PER_CONVERSATION=16
; --- application flags, deliberately unset ----------------------------------
; THICKET_AUTOSEND_INTERVAL_S=<seconds> and THICKET_AUTOSEND_DEST=<32 hex chars>
; compile in a timed unsolicited send to a fixed peer. Both or neither; setting
; one alone is a hard #error in src/main.cpp. They are NOT set here on purpose:
; the stock build transmits announces and auto-replies only, and never
; unsolicited traffic. The timed send is the fallback for proving the transmit
; path when auto-reply misbehaves, and it costs a reflash every time the peer's
; destination hash changes — which is the problem auto-reply exists to avoid.
; Add them on the command line, not in this file:
;   PLATFORMIO_BUILD_FLAGS="-DTHICKET_AUTOSEND_INTERVAL_S=60 -DTHICKET_AUTOSEND_DEST=<hex>" pio run -e wiscore_rak4631
; --- levers deliberately NOT taken yet --------------------------------------
; Measured, available, and not needed at 54% of the app region. Recorded here
; so they are found by reading rather than by rediscovery:
;   * own __verbose_terminate_handler: libstdc++ drags in cp-demangle.o (31,446 B
;     measured in this image) purely to pretty-print the type of an uncaught
;     exception onto a serial port nobody watches. A five-line file removes it.
;   * --specs=nano.specs instead of nosys: measured -56 KB on the pre-firmware
;     spike, but it changes printf/malloc/reentrancy and upstream disables it
;     with a comment that reads like an undocumented runtime failure. Needs a
;     board, not a linker.
;   * -fno-rtti: legal (zero dynamic_cast, zero typeid in the whole stack) and
;     worth 136 bytes. Not worth diverging from upstream's env for.
; --- diagnostics ------------------------------------------------------------
; Emit a linker map so scripts/mapsize.py can answer "where did the image go"
; deterministically instead of by argument. Costs nothing in the binary.
	-Wl,-Map,$BUILD_DIR/firmware.map
; --- include path -----------------------------------------------------------
; microLXMF's headers include <Bytes.h>, <Identity.h>, <Type.h> flat, but
; microReticulum's library.json exposes only src/ and the headers live in
; src/microReticulum/. Every consumer has to add this itself.
	-I$PROJECT_LIBDEPS_DIR/$PIOENV/microReticulum/src/microReticulum

[env:wiscore_rak4631]
platform = nordicnrf52
board = rak4630
board_build.variants_dir = variants
board_build.variant = rak4630
framework = arduino
build_unflags = ${thicket.build_unflags}
build_flags = ${thicket.build_flags}
lib_deps = ${thicket.lib_deps}
; Applies the pinned-dependency patches before compilation. Each patch is
; anchored to exact upstream text and aborts the build if that text moved.
extra_scripts =
	pre:scripts/patch_deps.py
	pre:scripts/check_approtect.py
monitor_speed = 115200

; ---------------------------------------------------------------------------
; No-BLE fallback. Kept alive from the start deliberately: the SoftDevice
; S140 reserves 0x00000-0x26000 = 155,648 B (152 KiB) of flash before our code
; exists. Dropping it moves the app region from 815,104 B to 966,656 B —
; +148 KiB, +18.6%. That is the single largest flash lever available.
;
; This env must keep building. If it rots, the fallback isn't a fallback.
; Cost of taking it: no BLE, therefore no BLE-based RNode mode — USB-only.
; Do not decide that now; measure and surface the delta when budget gets tight.
[env:wiscore_rak4631-noble]
extends = env:wiscore_rak4631
board_build.ldscript = linker/nrf52840_noble.ld
build_flags =
	${thicket.build_flags}
	-DTHICKET_NO_BLE

; ---------------------------------------------------------------------------
; Native host build, for unit-testing code that has no hardware dependency.
;
; Exists because CI currently proves the DEPENDENCY works (the interop suite
; against Python RNS) and proves nothing about our own code. Anything that can
; be written without touching Arduino belongs here first, tested, and is only
; then wired into the firmware.
;
; The Micron parser is the first resident. Deliberately NOT referenced from
; src/main.cpp yet: main.cpp has never executed on hardware, and restructuring
; an untested boot path before first bring-up makes every later failure
; ambiguous.
;
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
	-std=c++17
	-Wall
	-Wextra
	-g
	; microStore's adapters are each behind their own feature macro. The stdio
	; one is the host-side filesystem and is what lets a native test drive a
	; real store instead of a mock.
	-DUSTORE_USE_STDIOFS
; Only the portable libraries; nothing here may pull in Arduino.
; microStore qualifies: it is header-only and ships StdioFileSystem precisely
; for host use. Same SHA as the device envs, so a host test exercises the same
; code the board runs. Pinned, not floating, for the same reason as above.
lib_deps =
	https://github.com/attermann/microStore.git#0f28567fe00ab8ab14624a34c2e9e0a000a44c46
lib_compat_mode = off
test_framework = unity

; ---------------------------------------------------------------------------
; Bring-up only. No external flash, no persistence: the identity is generated
; in RAM every boot and the device's address changes with it.
;
; This exists to reach the SX1262 on a board with no RAK15001 in the IO slot.
; It is a separate env rather than a flag on the baseline so that it cannot be
; set by accident, and so that a build carrying it is visible in the env name.
;
; ⚠ A green run here is evidence about the radio and about nothing else. It
; cannot show that a peer sees the same identity hash after a power cycle,
; which is the half of the done-condition a demo cannot fake.
; ---------------------------------------------------------------------------
[env:wiscore_rak4631-noflash]
extends = env:wiscore_rak4631
build_flags =
	${env:wiscore_rak4631.build_flags}
	-DTHICKET_NO_PERSISTENCE
	-DUSTORE_USE_NOOPFS

; ---------------------------------------------------------------------------
; Bring-up only, and deliberately against this file's own advice. Uses the
; ~28 KB INTERNAL filesystem so Identity::remember() has somewhere real to
; write, which is what a round trip needs and what the no-op build cannot give.
;
; ⚠ The internal filesystem is far too small to ship on. There is also an
; unverified upstream claim that its erases stall the radio.
; ---------------------------------------------------------------------------
[env:wiscore_rak4631-internalfs]
extends = env:wiscore_rak4631
build_flags =
	${env:wiscore_rak4631.build_flags}
	-DTHICKET_NO_PERSISTENCE
	-DTHICKET_INTERNAL_FS
	-DUSTORE_USE_INTERNALFS
